# Validate this public website on free standard GitHub compute without artifact or cache storage.
name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: npm ci
      - run: npm run check:repository
      - run: npm run lint -- --max-warnings 0
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run assets:audit:fail
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
